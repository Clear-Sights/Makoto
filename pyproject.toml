[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "makoto"
version = "2.2.0"
description = "Integrity hook for Claude Code — checks the agent's claims against its own logged deeds; regression fixtures are not an independent false-positive survey"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "skill-labV2"}]
license = {text = "Apache-2.0"}
keywords = ["claude-code", "guardrails", "integrity", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/skill-labV2/makoto"

[tool.setuptools]
include-package-data = true

# every subpackage ships, not just the top-level one: `makoto._dispatch` imports
# makoto.core / .checks / .record / .session / .substrate / .verdict at hook fire
# time, so a wheel carrying only makoto/*.py installs a runtime that cannot start.
[tool.setuptools.packages.find]
include = ["makoto*"]
namespaces = false

# non-.py files the runtime reads at fire time: the hook shim settings.json/hooks.json
# point at, the packaged canonical citation list, and the just-in-time conventions doc.
[tool.setuptools.package-data]
makoto = ["_dispatch_shim.sh", "_dispatch_configchange_shim.sh", "docs/*.md"]

[tool.setuptools.exclude-package-data]
makoto = ["*.bak"]
