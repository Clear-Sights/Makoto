[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "makoto"
version = "2.3.0"
description = "Integrity hook for Claude Code — holds the agent's claims against its own logged deeds and blocks faked checks; every check ships at measured zero false positives"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Clear-Sights"}]
license = {text = "Apache-2.0"}
keywords = ["claude-code", "guardrails", "integrity", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Clear-Sights/Makoto"

[tool.setuptools]
# The package lives under plugin/ -- that directory IS the installed plugin, and nothing
# outside it ships. See .claude-plugin/marketplace.json.
package-dir = {"makoto" = "plugin/makoto"}
packages = ["makoto"]
include-package-data = true

[tool.setuptools.package-data]
makoto = ["config/*.toml"]

[tool.setuptools.exclude-package-data]
makoto = ["tests/*", "docs/*", "*.bak"]
