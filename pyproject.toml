[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "makoto"
version = "2.4.0"
description = "Integrity hook for Claude Code — holds the agent's claims against its own logged deeds and blocks faked checks; every check ships at measured zero false positives"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Clear-Sights"}]
license = {text = "Apache-2.0"}
keywords = ["claude-code", "guardrails", "integrity", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Clear-Sights/Makoto"

[tool.setuptools]
# The package lives under plugin/ -- that directory IS the installed plugin, and nothing
# outside it ships. See .claude-plugin/marketplace.json.
include-package-data = true

[tool.setuptools.packages.find]
# Discovery, not a literal list: `packages = ["makoto"]` shipped ONLY the top-level
# modules, so makoto.core / makoto.state / makoto.checks / makoto.substrate were absent
# from every built wheel and `makoto.dispatch` died on its first import. Matches the
# idiom in the sibling Ward plugin.
where = ["plugin"]
include = ["makoto*"]

[tool.setuptools.package-data]
makoto = ["config/*.toml"]

[tool.setuptools.exclude-package-data]
makoto = ["tests/*", "docs/*", "*.bak"]

[tool.pytest.ini_options]
# Prefer the in-repo package over whatever else is on sys.path, so a checkout is
# tested against its own source. Note this does NOT override a stale editable
# install's sys.meta_path finder, which outranks sys.path -- if `import makoto`
# resolves to another checkout, remove that install rather than relying on this.
pythonpath = ["plugin"]
